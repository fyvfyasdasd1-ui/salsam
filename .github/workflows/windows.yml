name: Windows build and validation

on:
  push:
    branches: [salsam-download]
    paths-ignore: ['downloads/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check reusable logic and measurement parsing
        run: ./scripts/Invoke-Check.ps1 -Project tests/Salsam.Checks
      - name: Verify native settings and recovery
        run: ./scripts/Invoke-Check.ps1 -Project tests/Salsam.WindowsChecks
      - name: Build self-contained single EXE
        run: dotnet publish src/Salsam.App/Salsam.App.csproj -c Release -r win-x64 --self-contained true -p:PublishProfile=Portable -p:DebugType=None -p:DebugSymbols=false -o artifacts/portable-x64
      - name: Exercise the portable GUI
        shell: powershell
        run: |
          try {
            ./scripts/Smoke-Portable.ps1 -ExePath ./artifacts/portable-x64/Salsam.exe
          } catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Portable GUI check::$detail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Salsam-Windows-x64
          path: artifacts/portable-x64/Salsam.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Salsam-GUI-review
          path: artifacts/smoke.png
          if-no-files-found: warn
